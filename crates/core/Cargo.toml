[package]
name = "rustsolar-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Pure calculations for RustSolar: solar geometry, PV model, energy integration, battery simulation, tariffs."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
